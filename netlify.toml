# Netlify build configuration for Art of Voices.
#
# Email notifications for the contact form are configured in the Netlify
# dashboard, not here — the docs do not (yet) support form notifications via
# netlify.toml. See FORMS.md for the one-time setup steps.

[build]
  command = "npx astro build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# 301 redirects from the old WordPress URL structure to the new site, so old
# Google results / bookmarks land on the right page instead of a 404 (and so
# Google refreshes its index faster). /impressum/ is unchanged, so no rule.
[[redirects]]
  from = "/sprecherinnen/*"
  to = "/#roster"
  status = 301

[[redirects]]
  from = "/ueber-uns/*"
  to = "/#about"
  status = 301

[[redirects]]
  from = "/referenzen/*"
  to = "/#referenzen"
  status = 301

[[redirects]]
  from = "/aktuelle-produktionen/*"
  to = "/#roster"
  status = 301

[[redirects]]
  from = "/kontakt/*"
  to = "/#kontakt"
  status = 301

[[redirects]]
  from = "/login/*"
  to = "/"
  status = 301

# Recommended security headers for a static marketing site.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Cache hashed assets aggressively, keep HTML fresh.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
